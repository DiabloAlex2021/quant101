<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Stock Chat Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        :root {
            --bg: #0b0b0d;
            --bg-alt: #151518;
            --border: #2a2a2f;
            --accent: #f5f5f5;
            --accent-soft: #d0d0d5;
            --user-bubble: #26262b;
            --bot-bubble: #111116;
            --scrollbar: #44444a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background: radial-gradient(circle at top, #18181f 0, #050507 45%, #000000 100%);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 960px;
            height: 90vh;
            background: linear-gradient(145deg, #060608, #101017);
            border-radius: 24px;
            border: 1px solid #23232a;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.02),
                0 28px 80px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(12px);
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent-soft);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #36c96f;
            box-shadow: 0 0 12px rgba(54, 201, 111, 0.9);
            margin-right: 6px;
        }

        .status {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #8e8ea0;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px 16px 0;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--scrollbar);
            border-radius: 999px;
        }

        .message-row {
            display: flex;
            margin: 6px 0;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-row.user .message-bubble {
            background: var(--user-bubble);
            color: var(--accent);
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.09);
        }

        .message-row.bot .message-bubble {
            background: var(--bot-bubble);
            color: #e3e3ea;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .ticker-highlight {
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .meta-line {
            font-size: 12px;
            color: #a0a0b0;
            margin-top: 4px;
        }

        .input-area {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border);
            background: linear-gradient(to top, #050507 0, #090910 100%);
        }

        .input-inner {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #0a0a10;
            border-radius: 999px;
            border: 1px solid #2b2b32;
            padding: 8px 10px 8px 16px;
        }

        .input-inner:focus-within {
            border-color: #f5f5f5;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.09);
        }

        .chat-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--accent);
            font-size: 14px;
            padding: 6px 0;
        }

        .chat-input::placeholder {
            color: #6c6c78;
        }

        .send-btn {
            border: none;
            outline: none;
            background: #f5f5f5;
            color: #000000;
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        @media (max-width: 640px) {
            .app {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="app-header">
        <div class="app-title">Stock Chat Bot</div>
        <div class="status">
            <div class="status-dot"></div>
            Live Yahoo Finance
        </div>
    </header>

    <main class="chat">
        <div id="messages" class="messages"></div>
    </main>

    <section class="input-area">
        <form id="chat-form" class="input-inner" autocomplete="off">
            <input
                id="chat-input"
                class="chat-input"
                type="text"
                placeholder="Ask: AAPL, TSLA, NVDA… (just type the ticker)"
            />
            <button id="send-btn" class="send-btn" type="submit">Send</button>
        </form>
    </section>
</div>

<script>
    // Change this if proxy.php is on another server:
    // e.g. const PROXY_URL = "https://yourserver.com/proxy.php";
    const PROXY_URL = "proxy.php";

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(role, text) {
        const row = document.createElement("div");
        row.className = "message-row " + (role === "user" ? "user" : "bot");

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;

        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendQuoteMessage(info) {
        const row = document.createElement("div");
        row.className = "message-row bot";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";

        const title = document.createElement("div");
        title.innerHTML =
            '<span class="ticker-highlight">' +
            info.ticker +
            "</span> · " +
            (info.name || "Yahoo Finance");

        const body = document.createElement("div");
        body.style.marginTop = "4px";
        const betaText =
            info.beta === "" || info.beta === null || Number.isNaN(info.beta)
                ? "Beta: (not available)"
                : "Beta: " + info.beta.toFixed(3);

        body.textContent =
            "Price: " +
            info.price +
            (info.currency ? " " + info.currency : "") +
            "\n" +
            betaText;

        const meta = document.createElement("div");
        meta.className = "meta-line";
        meta.textContent = "Source: Yahoo Finance · " + new Date().toLocaleString();

        bubble.appendChild(title);
        bubble.appendChild(body);
        bubble.appendChild(meta);

        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function fetchQuote(ticker) {
        const url =
            PROXY_URL +
            "?t=" +
            encodeURIComponent(ticker.trim());

        const res = await fetch(url, {
            method: "GET"
        });

        if (!res.ok) {
            const text = await res.text();
            throw new Error("Proxy HTTP " + res.status + ": " + text);
        }

        const data = await res.json();

        if (data.error) {
            throw new Error("Proxy error: " + data.error);
        }

        if (
            !data.quoteResponse ||
            !data.quoteResponse.result ||
            !data.quoteResponse.result.length
        ) {
            throw new Error("No quote data for " + ticker);
        }

        const q = data.quoteResponse.result[0];
        const price = q.regularMarketPrice;
        const beta =
            typeof q.beta === "number"
                ? q.beta
                : typeof q.beta3Year === "number"
                ? q.beta3Year
                : "";

        if (price === undefined || price === null) {
            throw new Error("Price not available for " + ticker);
        }

        return {
            ticker: (q.symbol || ticker || "").toUpperCase(),
            name: q.longName || q.shortName || "",
            price: price,
            beta: beta,
            currency: q.currency || q.financialCurrency || ""
        };
    }

    async function handleUserInput(text) {
        const raw = text.trim();
        if (!raw) return;

        // For simplicity: treat first token as ticker
        const ticker = raw.split(/\s+/)[0].toUpperCase();

        appendMessage(
            "bot",
            "Fetching real-time price and beta for " + ticker + "…"
        );
        sendBtn.disabled = true;
        inputEl.disabled = true;

        try {
            const quote = await fetchQuote(ticker);
            appendQuoteMessage(quote);
        } catch (err) {
            appendMessage(
                "bot",
                "Request failed. " +
                    (err && err.message ? err.message : "Check your PHP proxy or network.")
            );
        } finally {
            sendBtn.disabled = false;
            inputEl.disabled = false;
            inputEl.focus();
        }
    }

    formEl.addEventListener("submit", function (e) {
        e.preventDefault();
        const text = inputEl.value;
        if (!text.trim()) return;

        appendMessage("user", text);
        inputEl.value = "";
        handleUserInput(text);
    });

    // Initial greeting
    appendMessage(
        "bot",
        "Hi, I can fetch real-time price and beta from Yahoo Finance.\nType a ticker like AAPL, TSLA, or NVDA."
    );
</script>
</body>
</html>
